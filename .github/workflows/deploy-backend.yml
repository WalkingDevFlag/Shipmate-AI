name: Deploy Backend (GHCR)

# Builds the backend image on a GitHub runner (which HAS Docker) and pushes it
# to GHCR. This sidesteps the "Azure for Students" subscription's block on ACR
# Tasks (cloud Docker builds are TasksOperationsNotAllowed) — and needs no Azure
# service principal (the student account lacks AD perms to create one). After
# the image is on GHCR, the Container App is pointed at it with a one-line
# `az containerapp update --image …` (run separately by a maintainer, or wire
# an azure/login OIDC step here later if an SP becomes available).
#
# Trigger manually (workflow_dispatch) or on a push to the deploy branch.

on:
  workflow_dispatch:
  push:
    branches: [feat/azure-deploy]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  packages: write          # push to GHCR with the built-in GITHUB_TOKEN

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        # GHCR requires the repository path to be lowercase, but the owner
        # (WalkingDevFlag) is mixed-case — downcase it here.
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/shipmate-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push backend image
        uses: docker/build-push-action@v5
        with:
          # Self-contained backend/ context (COPY paths relative to backend/),
          # same as the CI docker-smoke job and the Container App expects.
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "Pushed ${{ steps.img.outputs.image }}:latest and :${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Point the Container App at it:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "az containerapp update -n shipmate-api -g shipmate-rg --image ${{ steps.img.outputs.image }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
