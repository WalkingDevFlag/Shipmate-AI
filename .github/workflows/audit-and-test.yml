name: Audit & Baseline Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-audit-and-test:
    name: Backend – pip audit & pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest pytest-cov

      - name: Run pip audit
        # Continue so test results are always uploaded even if vulnerabilities found
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --output pip-audit-report.json --format json

      - name: Upload pip audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          if-no-files-found: ignore

      - name: Run pytest with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml -v || true

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/test-results.xml
          if-no-files-found: ignore

  frontend-audit-and-test:
    name: Frontend – npm audit & vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # Continue so test results are always uploaded even if vulnerabilities found
        continue-on-error: true
        run: npm audit --json > npm-audit-report.json 2>&1 || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          if-no-files-found: ignore

      - name: Run frontend tests with coverage
        run: npx vitest run --coverage || true

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
